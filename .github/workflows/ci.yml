name: TORI-RENDER CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format
        run: bash scripts/format.sh

      - name: Verify formatting
        run: |
          git diff --exit-code || (echo "Formatting check failed. Run: bash scripts/format.sh" && exit 1)

  build-and-test:
    runs-on: ubuntu-latest
    needs: format-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libopenmpi-dev openmpi-bin libomp-dev nlohmann-json3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTORIRENDER_BUILD_TESTS=ON -DTORIRENDER_FETCH_CATCH2=ON -DTORIRENDER_FETCH_STB=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure
